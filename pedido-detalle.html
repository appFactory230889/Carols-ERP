<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Detalle de pedido · Carols50</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">Detalle de pedido</div>
  <img class="topbar-logo" src="https://firebasestorage.googleapis.com/v0/b/distribuidora-carols.firebasestorage.app/o/logo%2Fblack.JPG?alt=media&token=a3f3dc44-4ea4-4c9d-bb01-bcd5e7c2a281" alt="Carol's" />
</header>
<main>
  <div class="info-card">
    <div class="card-row">
      <div>
        <h2 id="nombre-cliente">Cargando…</h2>
        <p class="muted" id="fecha-entrega"></p>
      </div>
      <div class="card-actions" style="margin-top:0;">
        <button class="btn btn-outline btn-sm" id="btn-copiar-enlace" hidden>🔗 Copiar enlace para el cliente</button>
        <button class="btn btn-outline btn-sm" id="btn-datos-cliente">Ver datos del cliente</button>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-box"><div class="label">Monto</div><div class="value" id="v-monto">$0.00</div></div>
      <div class="stat-box"><div class="label">Más envío ($4.50)</div><div class="value" id="v-monto-envio">$0.00</div></div>
      <div class="stat-box"><div class="label">Total anticipos</div><div class="value" id="v-anticipos">$0.00</div></div>
      <div class="stat-box"><div class="label">Saldo pendiente</div><div class="value" id="v-saldo">$0.00</div></div>
    </div>

  </div>

  <div class="section-title">Piezas del pedido</div>
  <div id="lista-piezas"><div class="loader">Cargando piezas…</div></div>

  <div class="section-title">Anticipos</div>
  <div class="info-card">
    <div id="lista-anticipos"><div class="loader">Cargando anticipos…</div></div>
  </div>

  <a class="fab" id="btn-agregar-prenda" title="Agregar prenda a este pedido" hidden style="text-decoration:none; display:flex; align-items:center; justify-content:center;">+</a>
</main>

<div class="modal-overlay" id="modal-datos-cliente" hidden>
  <div class="modal">
    <h2>Datos de la clienta</h2>
    <p id="datos-cliente-texto"></p>
    <div class="modal-actions">
      <button class="btn btn-primary" id="btn-cerrar-datos">Cerrar</button>
    </div>
  </div>
</div>

<script type="module" src="js/pedido-detalle.js"></script>
</body>
</html>
